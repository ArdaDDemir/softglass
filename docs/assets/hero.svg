<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Softglass</title>
  <desc id="desc">Hand-authored hero matching Softglass Aurora tokens: frost chrome, violet accent, four language chips.</desc>
  <defs>
    <!-- Exact-ish Aurora token stack -->
    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <radialGradient id="orbV" cx="12%" cy="0%" r="48%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbM" cx="92%" cy="8%" r="42%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbS" cx="48%" cy="100%" r="46%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Frost / glass materials (token surfaces) -->
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="frostStrong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="glossTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent = Aurora token #7c3aed -->
    <linearGradient id="accentSolid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accentGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="elevated" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#6366f1" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <style type="text/css"><![CDATA[
      .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .title { font-weight: 700; fill: #0f172a; letter-spacing: -0.03em; }
      .sub { font-weight: 500; fill: #475569; }
      .muted { font-weight: 500; fill: #64748b; }
      .fg { font-weight: 600; fill: #0f172a; }
      .onAccent { font-weight: 600; fill: #ffffff; }
      .accent { font-weight: 600; fill: #6d28d9; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgBase)"/>
  <rect width="1280" height="720" fill="url(#orbV)"/>
  <rect width="1280" height="720" fill="url(#orbM)"/>
  <rect width="1280" height="720" fill="url(#orbS)"/>

  <!-- Soft blobs (playground style, no heavy blur) -->
  <circle cx="210" cy="120" r="120" fill="#a78bfa" opacity="0.14"/>
  <circle cx="1080" cy="160" r="140" fill="#6ee7b7" opacity="0.12"/>
  <circle cx="900" cy="600" r="150" fill="#7dd3fc" opacity="0.12"/>

  <!-- ========== LEFT: brand ========== -->
  <g transform="translate(96 150)">
    <!-- Badge: accent-soft pill (sg-badge-accent language) — short label only -->
    <g filter="url(#soft)">
      <rect x="0" y="0" width="64" height="28" rx="999" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.18)"/>
      <rect x="0" y="0" width="64" height="12" rx="999" fill="url(#glossTop)"/>
      <text x="32" y="18" text-anchor="middle" class="t accent" font-size="12">v1.0</text>
    </g>

    <text x="0" y="92" class="t title" font-size="68">Softglass</text>
    <text x="0" y="138" class="t sub" font-size="22">Open soft-glass design system for Next.js</text>
    <text x="0" y="172" class="t muted" font-size="16">One engine · four languages · you own the code</text>

    <!-- Language row: frost chips + color dots (not rainbow candy bars) -->
    <g transform="translate(0 214)">
      <!-- Aurora -->
      <g filter="url(#soft)">
        <rect width="118" height="40" rx="20" fill="url(#frost)" stroke="rgba(15,23,42,0.1)"/>
        <rect width="118" height="16" rx="20" fill="url(#glossTop)"/>
        <circle cx="22" cy="20" r="7" fill="#7c3aed"/>
        <text x="68" y="25" text-anchor="middle" class="t fg" font-size="14">Aurora</text>
      </g>
      <!-- Obsidian -->
      <g transform="translate(130 0)" filter="url(#soft)">
        <rect width="126" height="40" rx="20" fill="url(#frost)" stroke="rgba(15,23,42,0.1)"/>
        <rect width="126" height="16" rx="20" fill="url(#glossTop)"/>
        <circle cx="22" cy="20" r="7" fill="#0f172a"/>
        <text x="74" y="25" text-anchor="middle" class="t fg" font-size="14">Obsidian</text>
      </g>
      <!-- Mist -->
      <g transform="translate(268 0)" filter="url(#soft)">
        <rect width="100" height="40" rx="20" fill="url(#frost)" stroke="rgba(15,23,42,0.1)"/>
        <rect width="100" height="16" rx="20" fill="url(#glossTop)"/>
        <circle cx="22" cy="20" r="7" fill="#94a3b8"/>
        <text x="60" y="25" text-anchor="middle" class="t fg" font-size="14">Mist</text>
      </g>
      <!-- Pearl -->
      <g transform="translate(380 0)" filter="url(#soft)">
        <rect width="104" height="40" rx="20" fill="url(#frost)" stroke="rgba(15,23,42,0.1)"/>
        <rect width="104" height="16" rx="20" fill="url(#glossTop)"/>
        <circle cx="22" cy="20" r="7" fill="#f0c48a"/>
        <text x="62" y="25" text-anchor="middle" class="t fg" font-size="14">Pearl</text>
      </g>
    </g>

    <!-- Install: frost field-like, mono-ish -->
    <g transform="translate(0 286)" filter="url(#soft)">
      <rect width="420" height="48" rx="16" fill="url(#frostStrong)" stroke="rgba(15,23,42,0.1)"/>
      <rect width="420" height="18" rx="16" fill="url(#glossTop)"/>
      <text x="20" y="30" class="t muted" font-size="15">npm i @softglass/tokens @softglass/ui</text>
    </g>
  </g>

  <!-- ========== RIGHT: AppShell-ish product mock ========== -->
  <g transform="translate(640 88)" filter="url(#elevated)">
    <!-- Outer glass shell elevated frost -->
    <rect width="560" height="544" rx="24" fill="url(#frostStrong)" stroke="rgba(15,23,42,0.1)"/>
    <rect width="560" height="100" rx="24" fill="url(#glossTop)"/>

    <!-- App header Softglass chrome (no OS window dots) -->
    <g transform="translate(20 20)">
      <rect width="520" height="56" rx="16" fill="url(#frost)" stroke="rgba(15,23,42,0.1)"/>
      <rect width="520" height="22" rx="16" fill="url(#glossTop)"/>
      <text x="20" y="34" class="t title" font-size="16">Softglass</text>
      <text x="108" y="34" class="t muted" font-size="13">playground</text>
      <!-- theme badge -->
      <rect x="400" y="14" width="100" height="28" rx="14" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.16)"/>
      <text x="450" y="32" text-anchor="middle" class="t accent" font-size="12">aurora</text>
    </g>

    <!-- Inner solid content card -->
    <g transform="translate(36 100)">
      <rect width="488" height="400" rx="20" fill="rgba(255,255,255,0.88)" stroke="rgba(15,23,42,0.08)"/>
      <rect width="488" height="70" rx="20" fill="url(#glossTop)" opacity="0.55"/>

      <text x="28" y="44" class="t title" font-size="22">Ship calm UI</text>
      <text x="28" y="70" class="t muted" font-size="14">Glass = chrome · solid = long content</text>

      <!-- Field label + input (solid surface) -->
      <text x="28" y="112" class="t muted" font-size="13">Email</text>
      <g transform="translate(28 122)">
        <rect width="432" height="48" rx="16" fill="#ffffff" stroke="rgba(15,23,42,0.1)"/>
        <rect width="432" height="16" rx="16" fill="url(#glossTop)" opacity="0.4"/>
        <text x="16" y="30" class="t muted" font-size="15">you@brand.com</text>
      </g>

      <!-- Buttons: primary violet + ghost frost -->
      <g transform="translate(28 192)">
        <g filter="url(#soft)">
          <rect width="128" height="44" rx="999" fill="url(#accentSolid)"/>
          <rect width="128" height="16" rx="999" fill="url(#accentGloss)"/>
          <text x="64" y="28" text-anchor="middle" class="t onAccent" font-size="14">Continue</text>
        </g>
        <g transform="translate(140 0)">
          <rect width="108" height="44" rx="999" fill="url(#frost)" stroke="rgba(15,23,42,0.1)"/>
          <rect width="108" height="16" rx="999" fill="url(#glossTop)"/>
          <text x="54" y="28" text-anchor="middle" class="t fg" font-size="14">Ghost</text>
        </g>
        <!-- accent badge -->
        <g transform="translate(264 8)">
          <rect width="72" height="28" rx="999" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.16)"/>
          <text x="36" y="18" text-anchor="middle" class="t accent" font-size="12">accent</text>
        </g>
      </g>

      <!-- Tabs pill list (sg-tabs-list language) -->
      <g transform="translate(28 268)">
        <rect width="432" height="44" rx="22" fill="rgba(255,255,255,0.86)" stroke="rgba(15,23,42,0.1)"/>
        <rect width="432" height="16" rx="22" fill="url(#glossTop)" opacity="0.5"/>
        <!-- active trigger: accent soft pill -->
        <rect x="6" y="6" width="120" height="32" rx="16" fill="rgba(124,58,237,0.14)"/>
        <text x="66" y="27" text-anchor="middle" class="t accent" font-size="13">Overview</text>
        <text x="190" y="27" text-anchor="middle" class="t muted" font-size="13">Looks</text>
        <text x="300" y="27" text-anchor="middle" class="t muted" font-size="13">Docs</text>
        <text x="400" y="27" text-anchor="middle" class="t muted" font-size="13">API</text>
      </g>

      <!-- Alert info strip -->
      <g transform="translate(28 336)">
        <rect width="432" height="44" rx="14" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.2)"/>
        <circle cx="22" cy="22" r="5" fill="#7c3aed"/>
        <text x="40" y="27" class="t fg" font-size="13">Tokens loaded · theme aurora</text>
      </g>
    </g>
  </g>
</svg>
