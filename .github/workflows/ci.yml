name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck UI
        run: npm run typecheck

      - name: Unit smoke tests
        run: npm test

      - name: Build packages + playground
        run: npm run build

      - name: Pack dry-run
        run: npm run pack:check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual regression (gallery)
        run: npm run test:visual
